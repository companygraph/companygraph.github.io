<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1024" height="1024">
  <!-- Org avatar. Full-bleed square on purpose: GitHub applies its own rounding to org
       avatars, and a rounded rect here would show its corners through that mask. -->
  <rect width="24" height="24" fill="#0C0E13"/>
  <g fill="none" stroke="#7FA3D8" stroke-width="1.5" stroke-linecap="square" transform="translate(.25,0)">
    <rect x="1.75" y="5.75" width="10.5" height="12.5" rx="1.5"/>
    <rect x="4.5" y="9.5" width="5" height="5" fill="#7FA3D8" stroke="none"/>
    <path d="M12.25 12 h4.5"/>
    <rect x="16.75" y="9.5" width="5" height="5" fill="#7FA3D8" stroke="none"/>
  </g>
</svg>
