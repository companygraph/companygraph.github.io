name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Two ways to hang this job in the server step are already documented in CLAUDE.md and
    # both were hit for real. A third would otherwise burn the 360-minute default before
    # anyone learned it existed, on a check destined to be required.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # First, because it needs nothing installed and it catches the one failure the browser
      # cannot see: a note edited without regenerating its clip renders perfectly and speaks
      # the old words. --dry-run bills nothing and needs no key. blust.ch has had this step
      # since its clips existed; here thirteen stale clips reached main before it did.
      - name: Clips still say what the notes say
        working-directory: talks/intro/tts
        run: |
          out=$(./generate.py --dry-run)
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q 'would write'; then
            echo "::error::narration is stale — run talks/intro/tts/generate.py and commit the clips"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # Every region this site derives from the model, held against the artifacts it derives
      # them from. Before npm ci because it installs nothing: pages.mjs and its renderers are
      # node built-ins and two committed files, with no network. That is the whole reason the
      # artifacts are committed — the check that catches a page edited by hand is also the
      # cheapest step in this job.
      - name: The derived regions still match the artifacts
        run: npm run pages:check
      - run: npm ci
      # How far the model pin has fallen behind what it points at. Non-blocking on purpose:
      # the pin is editorial — it says which state of the model these pages publish — so a pin
      # behind its upstream is either deliberate or waiting to be looked at, and no script can
      # tell those apart. It reports and passes; a red check here would be ignored by the
      # second week. The token is only for the rate limit.
      - name: How far the model pin has fallen behind
        run: npm run pin:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # After npm ci, and this is not cosmetic: build/build.mjs imports the parser from
      # companygraph-meta-model, which is not on disk until then. Left above npm ci it fails
      # every push with ERR_MODULE_NOT_FOUND, and a local run cannot catch that, because
      # node_modules is already on the machine.
      - name: The artifacts still match the pinned commit
        run: npm run build:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # After npm ci because both now import @robertblust/design, which is not on disk until
      # then; before the browser because neither renders a page. A stale card is the one
      # failure the browser suite cannot see — the card is a valid PNG of a page that has
      # since moved on.
      - name: The card check still works
        run: npm run test:og
      - name: Cards still show the page they render
        run: npm run og:check
      # After npm ci because it needs the package; before the browser because a file that is
      # not what the package ships should fail on the cheap step, not on a rendered page.
      - name: The shared files are still what the package ships
        run: npm run design:check
      - name: The vendored d3 is the pinned build
        run: npm run test:d3
      - run: npx playwright install --with-deps chromium
      - name: Serve the site
        run: python3 -m http.server 8000 > /dev/null 2>&1 &
      - name: Wait for the server
        run: |
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 0.5
          done
          echo "Server never came up on :8000" >&2
          exit 1
      - name: Assert what it renders
        run: npm run verify
