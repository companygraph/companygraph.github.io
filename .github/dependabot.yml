# playwright is a devDependency and the export scripts drive `npm run verify`, `npm run og`
# and `npm run pdf`, none of which reaches a visitor.
#
# d3 is the exception, and it is the reason this file matters more here than on the sibling
# sites. The shared stage — `stage.js`, linked by every page that draws a data block — loads
# `d3.v7.min.js` beside it at the root, a vendored copy of the pinned package's build, so d3
# is the one dependency in this repository that a visitor executes, now on more than one page.
# `verify/instance.test.mjs` asserts the two are byte-identical, which means a Dependabot
# bump of d3 lands red on purpose, with the message "copy it again". That is the correct
# signal, not a nuisance to be silenced with an ignore rule: an ignored d3 is a shipped
# asset that ages forever with nothing saying so. Clearing such a pull request is
# re-vendoring the file and re-rendering every card that names it — `npm run og`.
#
# It is also why d3 sits in `dependencies` and not `devDependencies`, which is where it used
# to be. The organisation runs GitHub's "dismiss low-impact alerts for development-scoped
# dependencies" preset — correct for playwright, which no visitor ever runs — and under the
# old scope it auto-dismissed low and medium d3 alerts on a file a browser executes. The
# scope is load-bearing now, not cosmetic: moving d3 back silences those alerts again, and
# nothing says so.
#
# The shape is copied from guestgraph/engine, deliberately — the same duplication the design
# tokens and the deck footer have, and the same absence of a tripwire. Grouping minor and
# patch means a quiet week is one pull request, not five; a major arrives on its own.
version: 2
updates:
  # One package.json, at the root. There used to be a second under talks/intro carrying the
  # deck's `pdf` script and pdf-lib, which meant a bump there landed green having proved
  # nothing — CI only ever ran `npm ci` at the root. The script and the dependency moved to
  # the root on 2026-08-26, so there is one manifest and CI exercises it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Declared first on purpose: Dependabot puts a dependency in the FIRST group it matches,
      # so naming the design package here keeps it out of minor-and-patch below. A design
      # release is a minor by the package's own semver policy, so without this it would arrive
      # bundled with a Playwright or pdf-lib bump — and this is the one pull request that has
      # to be read rather than merged on sight: it goes red until someone runs `npm run design`
      # and commits what changed.
      design:
        patterns:
          - "@robertblust/design"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
