# playwright is a devDependency and the export scripts drive `npm run verify`, `npm run og`
# and `npm run pdf`, none of which reaches a visitor.
#
# d3 is the exception, and it is the reason this file matters more here than on the sibling
# sites. The shared stage — `stage.js`, linked by every page that draws a data block — loads
# `d3.v7.min.js` beside it at the root, a vendored copy of the pinned package's build, so d3
# is the one dependency in this repository that a visitor executes, now on more than one page.
# `verify/d3-vendoring.test.mjs` asserts the two are byte-identical, which means a Dependabot
# bump of d3 lands red on purpose. That is the correct signal, not a nuisance to be
# silenced with an ignore rule: an ignored d3 is a shipped asset that ages forever with
# nothing saying so. But this file now has a second owner: `design:check` asserts the same
# committed copy matches `@robertblust/design`, which vendors its own `assets/d3.v7.min.js`.
# Re-vendoring from `node_modules/d3` alone — the old fix — clears `verify/d3-vendoring.test.mjs`
# and turns `design:check` red on the very next run, because the package's copy hasn't
# moved. There is no state of this file, edited only here, that clears both.
#
# A d3 bump is therefore a two-repository, ordered change: bump and re-vendor d3 in
# `robertblust/design` first and tag the release, then take the resulting design Dependabot
# pull request together with this repository's own d3 pull request, on one branch, and run
# `npm run design && npm run og` — never `npm run og` alone. Under the package's own semver
# rule a change needing a site edit beyond `npm run design` is a major, so this makes every
# d3 bump a major, not a minor, no matter how small the upstream release.
#
# Mind the trap: `robertblust/design` declares only the `github-actions` Dependabot
# ecosystem below and has no d3 dependency of its own, so it will never be told a new d3
# exists. The only repository Dependabot notifies is the one that can no longer clear the
# pull request alone.
#
# It is also why d3 sits in `dependencies` and not `devDependencies`, which is where it used
# to be. The organisation runs GitHub's "dismiss low-impact alerts for development-scoped
# dependencies" preset — correct for playwright, which no visitor ever runs — and under the
# old scope it auto-dismissed low and medium d3 alerts on a file a browser executes. The
# scope is load-bearing now, not cosmetic: moving d3 back silences those alerts again, and
# nothing says so.
#
# The shape is copied from guestgraph/engine, deliberately — the same duplication the design
# tokens and the deck footer have, and the same absence of a tripwire. Grouping minor and
# patch means a quiet week is one pull request, not five; a major arrives on its own.
version: 2
updates:
  # One package.json, at the root. There used to be a second under talks/intro carrying the
  # deck's `pdf` script and pdf-lib, which meant a bump there landed green having proved
  # nothing — CI only ever ran `npm ci` at the root. The script and the dependency moved to
  # the root on 2026-08-26, so there is one manifest and CI exercises it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Declared first on purpose: Dependabot puts a dependency in the FIRST group it matches,
      # so naming the design package here keeps it out of minor-and-patch below. A design
      # release is a minor by the package's own semver policy, so without this it would arrive
      # bundled with a Playwright or pdf-lib bump — and this is the one pull request that has
      # to be read rather than merged on sight: it goes red until someone runs `npm run design`
      # and commits what changed.
      design:
        patterns:
          - "@robertblust/design"
      # Same reason as design above, and the same requirement to be read: a meta-model release
      # can change how build/build.mjs reads the instance and the vocabulary, so the pull
      # request that bumps it is the one to check against the pages it draws. It arrives by
      # tag, which Dependabot reads only because the pin is a tag — the commit SHA in
      # source.json, pinning the same repository's data, is invisible to it entirely.
      #
      # A pull request from this group proposing a LOWER version is closed, never merged. That
      # happened three times on 2026-09-02 — v0.5.0 down to v0.4.1, a commit predating the
      # instance parser, so it has no lib/ and the import fails. CI caught it every time. The
      # cause is Dependabot's release cooldown, not its tag ranking: it dates each git tag by
      # that tag's GitHub Release and filters out anything released within three days.
      # meta-model had a Release for v0.5.0 alone, so the newest tag was excluded as too fresh
      # while the older tags, carrying no Release and therefore no date to filter on, all
      # survived — leaving v0.4.1 the best of the remainder. It stops once a release ages past
      # the cooldown, and does not recur while every recent tag carries one.
      meta-model:
        patterns:
          - "companygraph-meta-model"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
