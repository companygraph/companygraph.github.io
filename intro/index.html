     The head is English because it describes the page as delivered — the deck opens in
     English — and applyLang() swaps the title and description when a visitor picks German. -->

<style>
/* Self-hosted inside the deck directory, exactly as audio/ and the images are: the
   unit that has to survive being copied to someone else's machine is the folder,
   not the file. Before this the deck named a face it never shipped, so every slide
   rendered in whatever system-ui the room's laptop happened to have. */
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/Bricolage-var.woff2) format("woff2-variations"),url(fonts/Bricolage-var.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(fonts/InstrumentSans-var.woff2) format("woff2-variations"),url(fonts/InstrumentSans-var.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Plex Mono";src:url(fonts/PlexMono-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Mono";src:url(fonts/PlexMono-600.woff2) format("woff2");font-weight:600;font-display:swap}

  /* ─── design tokens · v1 · keep in step across every repository that shares them ───
     These sites share no stylesheet by design — a deck has to open from
     file:// — so this block is a copy, and each repo's verify suite asserts
     the copy still matches. Change it here, then run the checks.

     Brightness is confidence. Each stop has exactly one job:
       --c-weak  a candidate: considered, not accepted
       --c-mid   anything interactive — links, controls, the brand accent
       --c-firm  the resolved thing — the thesis, the current page
       --c-flag  a reversal; at most one per page, never decoration
  */
  :root{
    --ground:#0C0E13; --raise:#171A21; --rule:#232833;
    --ink:#EFEDE8;    --dim:#8A8B86;
    --c-weak:#3E5878; --c-mid:#7FA3D8; --c-firm:#B8D0FF; --c-flag:#D9A44F;
  /* ─── end design tokens ─────────────────────────────────────────────── */

    /* deck-only, and deliberately outside the shared block: a warning red the
       prose pages have no use for, and the transport's own two surfaces — the
       slab it is milled from and the recessed window the track number sits in. */
    --warn:#e0705e; --slab:#16181d; --lcd:#0a0b0e;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background:var(--ground); color:var(--ink);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .mono{font-family:"Plex Mono", ui-monospace, "SF Mono", Menlo, monospace}

  /* ─── the canvas ──────────────────────────────────────────────────────
     Slides are laid out once at 1600×900 and the whole plane is scaled to
     whatever the screen gives it, the way a presentation tool does it. Two
     things follow, and both were previously things to re-test rather than
     guarantees: a slide can never scroll, because the canvas always fits;
     and the composition is identical on every screen, because there is only
     one composition. Sizing by cqmin did the opposite — it derived width from
     viewport height, so a wider screen only ever bought more empty margin. */
  .deck{
    position:fixed; top:0; left:0;
    width:1600px; height:900px;   /* width is overwritten per screen, see fit() */
    transform-origin:0 0;
    container-type:size;
    background:radial-gradient(130% 85% at 50% 0%, var(--raise) 0%, var(--ground) 62%);
  }

  /* A slide can never be taller than the canvas, so anything that scales with
     width needs a ceiling. A square 300×300 diagram in a half-width column was
     780px tall on an ultrawide screen — inside a 900px frame that already held a
     kicker and a headline. The cap is well above any inline icon, so it only ever
     bites on a figure that was about to overflow. */
  .slide svg, .slide img{max-height:60cqmin}

  .slide{
    position:absolute; inset:0;
    display:none; flex-direction:column; justify-content:center;
    padding:6.5cqmin max(10cqmin, (100% - 1620px) / 2);
    opacity:0; transition:opacity .35s ease;
  }
  .slide.active{display:flex; opacity:1}
  /* Every direct child of the active slide rises, in order. This used to require a
     hand-applied .rise class, which meant a slide animated only if someone remembered —
     one deck had it on all fifty-five children, another on nine, a third on two. The rule
     now applies itself, so a new slide cannot be forgotten.
     The stagger ran out at four children while slides carry up to six, and the fifth and
     sixth inherited animation-delay:0 — firing before the first four rather than after.
     Hence steps to six and a catch-all beyond. */
  .slide.active > *{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .slide.active > *:nth-child(1){animation-delay:.05s}
  .slide.active > *:nth-child(2){animation-delay:.14s}
  .slide.active > *:nth-child(3){animation-delay:.24s}
  .slide.active > *:nth-child(4){animation-delay:.34s}
  .slide.active > *:nth-child(5){animation-delay:.43s}
  .slide.active > *:nth-child(6){animation-delay:.51s}
  .slide.active > *:nth-child(n+7){animation-delay:.58s}
  @media (prefers-reduced-motion: reduce){
    .slide.active > *{animation:none}
  }
  @keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}

  .kicker{
    font-family:"Plex Mono", ui-monospace, monospace;
    font-size:clamp(.82rem,1.6cqmin,1.15rem); letter-spacing:.22em; text-transform:uppercase;
    color:var(--c-mid); margin-bottom:3.2cqmin; display:flex; align-items:center; gap:1.1em;
  }
  .kicker::before{content:attr(data-n); color:var(--dim)}
  .kicker::after{content:""; flex:0 0 8cqmin; height:2px; background:var(--c-mid); opacity:.5}

  h1{
    font-weight:600; line-height:1.07; letter-spacing:-.02em;
    font-size:clamp(2.3rem,8.4cqmin,5.6rem); max-width:26ch;
  }
  h1 em{font-style:normal; color:var(--c-mid)}
  .sub{
    margin-top:3.4cqmin; font-size:clamp(1.25rem,3.1cqmin,2.5rem);
    color:var(--dim); max-width:48ch; line-height:1.4; font-weight:400;
  }
  .note{
    margin-top:4.4cqmin; font-size:clamp(1.05rem,2.3cqmin,1.7rem); color:var(--ink);
    padding-left:1.4cqmin; border-left:3px solid var(--c-mid); max-width:54ch; line-height:1.45;
  }

  /* people / agents split */
  .thennow{display:grid; grid-template-columns:1fr 1fr; gap:8cqmin; margin-top:3cqmin}
  .col h4{
    font-family:"Plex Mono",monospace; font-size:clamp(.9rem,1.7cqmin,1.25rem);
    letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin-bottom:2cqmin;
    padding-bottom:1.2cqmin; border-bottom:2px solid var(--rule);
  }
  .col.now h4{color:var(--c-mid); border-color:var(--c-mid)}
  .col p{font-size:clamp(1.25rem,2.9cqmin,2rem); line-height:1.3; font-weight:500}
  .col .small{font-size:clamp(1rem,2.1cqmin,1.45rem); color:var(--dim); font-weight:400; margin-top:1.4cqmin; line-height:1.4}
  .verdict{margin-top:4cqmin; font-size:clamp(1.25rem,2.9cqmin,2.1rem); font-weight:600}
  .verdict em{font-style:normal; color:var(--c-mid)}

  /* breadth left, example diagram right */
  .split{display:grid; grid-template-columns:0.9fr 1.1fr; gap:6cqmin; align-items:center; margin-top:2.4cqmin}
  .blist{list-style:none; display:flex; flex-direction:column; gap:1.8cqmin}
  .blist li{border-top:2px solid var(--rule); padding-top:1.2cqmin}
  .blist b{display:block; font-size:clamp(1.2rem,2.6cqmin,1.85rem); font-weight:600}
  .blist span{font-size:clamp(.98rem,1.85cqmin,1.35rem); color:var(--dim)}
  .diagram svg{width:100%; height:auto; display:block}
  .caption{margin-top:1.6cqmin; font-family:"Plex Mono",monospace; font-size:clamp(.82rem,1.6cqmin,1.15rem); color:var(--dim); letter-spacing:.02em}
  .caption b{color:var(--c-mid); font-weight:600}
  .stamp{
    margin-top:3.4cqmin; font-family:"Plex Mono",monospace; font-size:clamp(.9rem,1.7cqmin,1.25rem);
    color:var(--dim); letter-spacing:.02em;
  }
  .stamp b{color:var(--c-mid); font-weight:600}

  /* breadth grid (domains overview) */
  .grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:2.4cqmin 6cqmin; margin-top:4.4cqmin}
  .cell{border-top:2px solid var(--rule); padding-top:1.4cqmin}
  .cell b{display:block; font-size:clamp(1.1rem,2.3cqmin,1.65rem); font-weight:600}
  .cell span{font-size:clamp(.88rem,1.6cqmin,1.15rem); color:var(--dim)}

  /* example – diagram + list */
  .split.even{grid-template-columns:1fr 1.05fr; gap:6cqmin}
  .glossary{display:flex; flex-direction:column; gap:1.5cqmin; margin:0}
  .glossary div{border-top:2px solid var(--rule); padding-top:1.1cqmin}
  .glossary dt{font-family:"Plex Mono",monospace; color:var(--c-mid); font-weight:600; font-size:clamp(1.05rem,2.1cqmin,1.5rem)}
  .glossary dd{color:var(--dim); font-size:clamp(1rem,1.9cqmin,1.4rem); line-height:1.34; margin:.3cqmin 0 0}

  .big-punch{font-size:clamp(2.3rem,7.2cqmin,5.8rem)}

  /* title slide */
  /* the mark, so the opening slide is the same lockup the site opens with —
     on one line, sized so the mark's visual height sits at the wordmark's cap height */
  .titlelock{display:flex; align-items:center; gap:.32em}
  .titlemark{color:var(--c-mid); display:flex; flex:0 0 auto}
  .titlemark svg{width:clamp(2.6rem,9cqmin,6.6rem); height:clamp(2.6rem,9cqmin,6.6rem); display:block}
  .titlelock h1{margin:0}
  .name{display:flex; align-items:center; gap:.6em}
  .name .namemark{color:var(--c-mid); display:flex}
  .name .namemark svg{width:15px; height:15px; display:block}
  .name b{color:var(--ink); font-weight:600; letter-spacing:.01em; text-transform:none}
  .name b em{font-style:normal; color:var(--c-mid)}

  .title-slide{justify-content:center}
  .title-slide h1{font-size:clamp(2.8rem,11cqmin,7.2rem); max-width:20ch; line-height:1.02}
  .title-slide .sub{margin-top:4.2cqmin; max-width:54ch; font-size:clamp(1.3rem,3.4cqmin,2.6rem); color:var(--dim)}
  .title-slide .byline{margin-top:6cqmin; font-weight:500; font-size:clamp(.85rem,1.8cqmin,1.25rem); letter-spacing:.14em; color:var(--ink)}
  .title-slide .byline span{color:var(--dim)}

  /* SVG diagram tokens */
  .node{fill:var(--raise); stroke:var(--c-mid); stroke-width:1.5}
  .node.center{fill:#1c2130; stroke-width:2.2}
  .edge{stroke:var(--rule); stroke-width:1.5; fill:none}
  .edge.live{stroke:var(--c-mid); stroke-width:1.5; opacity:.7}
  .nlabel{fill:var(--ink); font-family:"Plex Mono",monospace; font-size:13px; text-anchor:middle; dominant-baseline:middle}
  .nlabel.c{fill:var(--c-mid); font-weight:700; font-size:14px}
  .flowbox{fill:var(--raise); stroke:var(--rule); stroke-width:1.5}
  .flowbox.hot{stroke:var(--c-mid)}
  .flowlabel{fill:var(--ink); font-family:"Plex Mono",monospace; font-size:14px; text-anchor:middle; dominant-baseline:middle}
  .gate{fill:#1c2130; stroke:var(--c-mid); stroke-width:2}
  .arrow{stroke:var(--c-mid); stroke-width:1.6; fill:none; marker-end:url(#ah)}
  .arrow.dim{stroke:var(--rule); marker-end:url(#ahd)}
  .node.warm{stroke:var(--c-flag)}
  .node.bad{stroke:var(--warn)}
  .nlabel.dim{fill:var(--dim); font-size:12px}
  .nlabel.warm{fill:var(--c-flag)}
  .band{fill:var(--raise); stroke:var(--rule); stroke-width:1.5}
  .band.merge{stroke:var(--c-mid)}
  .band.review{stroke:var(--c-flag)}
  .bandlabel{font-family:"Plex Mono",monospace; font-size:12.5px; dominant-baseline:middle}
  .layers{display:flex; flex-direction:column; gap:1.5cqmin; margin-top:3cqmin; max-width:86%}
  .layer{display:grid; grid-template-columns:auto 1fr; gap:1.6cqmin 2.2cqmin; align-items:baseline;
         border-left:3px solid var(--rule); padding:1.1cqmin 0 1.1cqmin 2cqmin}
  .layer.on{border-color:var(--c-mid)}
  .layer.human{border-color:var(--c-flag)}
  .layer .who{font-family:"Plex Mono",monospace; font-size:clamp(1rem,2cqmin,1.4rem); font-weight:600}
  .layer.on .who{color:var(--c-mid)} .layer.human .who{color:var(--c-flag)}
  .layer .what{font-size:clamp(.98rem,1.95cqmin,1.38rem); color:var(--dim); line-height:1.35}
  .ask{display:flex; flex-direction:column; gap:2cqmin; margin-top:3.4cqmin; max-width:80%}
  .ask li{list-style:none; border-top:2px solid var(--rule); padding-top:1.4cqmin;
          font-size:clamp(1.1rem,2.4cqmin,1.7rem); line-height:1.35}
  .ask li b{color:var(--c-mid)}
  .status{display:grid; grid-template-columns:auto 1fr; gap:1.4cqmin 2.4cqmin; margin-top:3.2cqmin; max-width:84%;
          font-size:clamp(1rem,2.1cqmin,1.45rem); line-height:1.4}
  .status .tick{font-family:"Plex Mono",monospace; color:var(--c-mid); font-weight:700}
  .status .todo{font-family:"Plex Mono",monospace; color:var(--dim)}
  .status .lbl b{font-weight:600}
  .status .lbl span{color:var(--dim)}

  .bar{position:fixed; left:0; bottom:0; height:4px; background:var(--c-mid); width:0; transition:width .35s ease; z-index:5}

  /* ---------- transport ----------
     One instrument along the bottom edge instead of four fixed corners competing for
     the same pixels. The counter lives inside the transport's display window: on the
     device this borrows from, the track number and the transport are one thing.
     --chromeH is measured in JS, because the notes sheet and the mobile progress bar
     both have to sit exactly on top of whatever height this row ends up at. */
  .chrome{
    position:fixed; left:0; right:0; bottom:0; z-index:21;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:0 4cqmin 2.6cqmin; pointer-events:none;
  }
  .chrome > *{pointer-events:auto}

  .name{grid-column:1; justify-self:start;
        font-family:"Plex Mono", ui-monospace, monospace; font-size:.72rem;
        color:var(--dim); letter-spacing:.14em; text-transform:uppercase}

  .transport{
    grid-column:2; justify-self:center;
    display:flex; align-items:center; gap:.45rem;
    background:var(--slab); border:1px solid var(--rule); border-radius:14px;
    padding:.45rem .55rem;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.055), 0 12px 34px rgba(0,0,0,.5);
  }

  /* the display window. The hairline under the number is the position of the clip that
     is speaking — how much of this slide is left — and is empty when nothing speaks. */
  .lcd{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    background:var(--lcd); border-radius:8px; padding:.44rem .62rem .38rem;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.85), inset 0 0 0 1px rgba(122,160,255,.1);
    font-family:"Plex Mono", ui-monospace, monospace; line-height:1;
    margin-right:.2rem;
  }
  .lcd .n{font-size:.76rem; font-weight:600; letter-spacing:.09em; color:var(--c-mid); white-space:nowrap}
  .lcd .n .sep, .lcd .n #tot{color:#4c566e}
  .lcd .n.msg{color:var(--c-flag); font-size:.62rem; letter-spacing:.14em}
  .lcd .clip{width:100%; height:2px; background:#1e2029; border-radius:2px; overflow:hidden}
  .lcd .clip i{display:block; height:100%; width:0; background:var(--c-mid); transition:width .25s linear}

  .tmain, .tside{display:flex; align-items:center; gap:.45rem}

  .tbtn{
    display:grid; place-items:center; width:34px; height:34px; flex:0 0 auto;
    background:none; border:0; border-radius:9px; color:var(--dim); cursor:pointer;
    transition:color .15s ease, background-color .15s ease, border-color .15s ease;
  }
  .tbtn svg{width:18px; height:18px; fill:currentColor; display:block}
  .tbtn svg.stroked{fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .tbtn:hover{color:var(--ink); background:#20242e}
  .tbtn:focus-visible{outline:2px solid var(--c-mid); outline-offset:2px; color:var(--ink)}
  .tbtn[aria-pressed="true"]{color:var(--c-mid); background:#1b2231}

  .tbtn.play{width:44px; height:44px; border-radius:50%; border:1.5px solid #39435c; color:var(--c-mid)}
  .tbtn.play svg{width:17px; height:17px}
  .tbtn.play:hover{background:#1b2231; border-color:var(--c-mid); color:var(--c-mid)}
  .tbtn .icontract{display:none}
  .tbtn[aria-pressed="true"] .icontract{display:block}
  .tbtn[aria-pressed="true"] .iexpand{display:none}
  .tbtn.play .ipause{display:none}
  .tbtn.play.on{background:var(--c-mid); border-color:var(--c-mid); color:var(--ground)}
  .tbtn.play.on .iplay{display:none}
  .tbtn.play.on .ipause{display:block}

  /* the exit is an <a>, so it works with no JS and the browser treats it as
     navigation — history, middle-click and "open in new tab" all behave. */
  a.tbtn{text-decoration:none}
  a.name{text-decoration:none; color:inherit; pointer-events:auto}
  a.name:hover, a.name:focus-visible{color:var(--ink)}

  .tdiv{width:1px; align-self:stretch; margin:.3rem .25rem; background:#333743; flex:0 0 auto}

  .seg{display:flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; flex:0 0 auto}
  .seg button{
    background:none; border:0; cursor:pointer; padding:.44rem .48rem;
    font-family:"Plex Mono", ui-monospace, monospace; font-size:.63rem; letter-spacing:.12em;
    color:var(--dim); transition:color .15s ease, background-color .15s ease;
  }
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{color:var(--c-mid); background:#1b2231; font-weight:600}
  .seg button:focus-visible{outline:2px solid var(--c-mid); outline-offset:-2px}

  @media (prefers-reduced-motion: reduce){
    .tbtn, .seg button, .lcd .clip i{transition:none}
  }

  .notes{position:fixed; inset:auto 0 0 0; background:#17181c; color:#f1ede4; border-top:2px solid var(--c-mid); padding:3cqmin 4cqmin calc(var(--chromeH,0px) + 2cqmin); transform:translateY(101%); transition:transform .3s ease; z-index:20; max-height:56vh; overflow:auto}
  .notes.show{transform:none}
  .notes h3{font-family:"Plex Mono",monospace; font-size:.8rem; letter-spacing:.16em; text-transform:uppercase; color:#9db0ff; margin-bottom:1.4cqmin}
  .notes p{font-size:clamp(.95rem,2cqmin,1.3rem); line-height:1.5; max-width:82ch}
  /* Zwei Rollen, klar getrennt: eine Regie-Instruktion wird nicht gesprochen,
     eine Betonung schon. Vorher war beides <em> und die Vertonung verschluckte Wörter. */
  .notes em.cue{font-style:italic; color:#9a9dab}
  .notes em{font-style:normal; font-weight:600; color:#f1ede4}
  .notes .time{float:right; color:#9db0ff; font-family:"Plex Mono",monospace}
  .notes .close{display:inline-block; margin-top:1.8cqmin; background:none; cursor:pointer;
                border:1px solid #33353d; border-radius:8px; padding:.5em .9em;
                color:#b7b0a2; font-family:"Plex Mono",monospace; font-size:.7rem; letter-spacing:.1em;
                text-transform:uppercase; transition:color .15s ease, border-color .15s ease}
  .notes .close:hover{color:#f1ede4; border-color:#9db0ff}
  .notes .close:focus-visible{outline:2px solid #9db0ff; outline-offset:2px}
  /* notes open: JS scales the active slide to fit above the panel */
  .deck.notes-open .slide.active{justify-content:flex-start; padding:4cqmin 10cqmin; transform-origin:top center}
  .deck.notes-open .split{align-items:start; margin-top:1.6cqmin}

  /* mobile / portrait */
  @media (max-width: 860px), (max-aspect-ratio: 4/5){
    /* the transport becomes the bottom edge itself: full width, flush, clear of the
       home indicator. The name credit goes — at this width it is the first thing that
       would push the controls off centre. */
    .chrome{
      grid-template-columns:1fr; padding:0;
      background:var(--slab); border-top:1px solid var(--rule);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .name{display:none}
    .notes{bottom:var(--chromeH,0px); padding-bottom:3cqmin;
           transform:translateY(calc(101% + var(--chromeH,0px)))}
    .transport{
      grid-column:1; justify-self:stretch; width:100%;
      background:none; border:0; border-radius:0; box-shadow:none;
      padding:.45rem .5rem; gap:.2rem; justify-content:space-between;
    }
    .tmain{gap:.1rem}
    .tside{gap:.2rem}
    .tbtn{width:44px; height:44px}
    .tbtn svg{width:20px; height:20px}
    .tbtn.play{width:46px; height:46px}
    .tdiv{margin:.4rem .1rem}
    .seg button{padding:0 .5rem; min-width:38px; min-height:44px}
    .lcd{padding:.42rem .5rem .36rem; margin-right:0}
    /* the deck progress bar sits on the transport's top edge, not behind it */
    .bar{bottom:var(--chromeH,0px)}
    .deck{inset:0; width:auto; height:auto; transform:none; container-type:normal}
    .slide{justify-content:flex-start; overflow-y:auto;
           padding:14cqmin 7vw calc(var(--chromeH,0px) + 5vh)}
    h1{font-size:clamp(1.7rem,7.5vw,3rem); max-width:100%}
    .big-punch{font-size:clamp(1.8rem,8vw,3.2rem); max-width:100%}
    .sub{font-size:clamp(1rem,4.4vw,1.5rem); max-width:100%}
    .note{font-size:clamp(.9rem,3.6vw,1.2rem); max-width:100%}
    .thennow, .split, .split.even, .grid{grid-template-columns:1fr; gap:5vw; max-width:100%}
    .kicker{margin-bottom:5vw}
  }
  /* below this the seven controls need every pixel; the slide kicker and the progress
     bar still say where you are */
  @media (max-width: 400px){
    .lcd{display:none}
    .transport{padding:.45rem .35rem}
    .tbtn{width:40px; height:40px}
    .tside{gap:.1rem}
    .tdiv{margin:.4rem .05rem}
    .seg button{padding:0 .3rem; min-width:32px; min-height:40px; font-size:.6rem; letter-spacing:.08em}
  }
  /* the smallest phones still in use. body{overflow:hidden} hides a transport that is
     wider than the screen instead of scrolling it, so this has to be measured, not assumed */
  @media (max-width: 350px){
    .transport{padding:.4rem .3rem}
    .tbtn{width:36px; height:36px}
    .tbtn svg{width:18px; height:18px}
    .tbtn.play{width:42px; height:42px}
    .tside{gap:.05rem}
    .seg button{min-width:28px; min-height:36px; padding:0 .22rem}
  }

  /* ─── display face ────────────────────────────────────────────────────
     Set last so it wins over the rules above. The slide headline carries the
     same face the site's does; everything else on a slide is a label or a
     value, and stays where it was. */
  h1{font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; letter-spacing:-.028em}
  h1 em{color:var(--c-firm)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>

</defs></svg>

<div class="deck" id="deck">

  <!-- 00 · Titel — data-say-title="no": the greeting is the opening, so the headline
       is not read out on top of it -->
  <section class="slide title-slide"
    data-say-title="no"
    data-time="0:00"
    data-notes="<em class='cue'>Der Titel liegt an, während ich eröffne.</em> CompanyGraph ist das Meta-Modell für den Betrieb eines Unternehmens — quelloffen, nicht verkauft. Es beschreibt ein Unternehmen als Graph aus Markdown-Dateien, geprüft von Agenten statt von einem Schema. <em class='cue'>Kurze Pause.</em> Zehn Minuten darüber, was das heisst und warum es zusammenhält."
    data-notes-en="<em class='cue'>The title stays up while I open.</em> CompanyGraph is the meta-model for operating a company — open source, not sold. It describes a company as a graph of Markdown files, checked by agents rather than a schema. <em class='cue'>Short pause.</em> Ten minutes on what that means and why it holds together.">
    <div class="kicker mono" data-n="00" data-de="Ein gemeinsames Vokabular, extrahiert">A shared vocabulary, extracted</div>
    <div class="titlelock">
      <span class="titlemark"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="2" y="6.75" width="10.5" height="10.5" rx="1.5"/><rect x="4.75" y="9.5" width="5" height="5" fill="currentColor" stroke="none"/><path d="M12.5 12 h4.5"/><rect x="17" y="9.5" width="5" height="5" fill="currentColor" stroke="none"/></svg></span>
      <h1 data-de="Company<em>Graph</em>.">Company<em>Graph</em>.</h1>
    </div>
    <p class="sub" data-de="Das Meta-Modell für den Betrieb eines Unternehmens.">The meta-model for operating a company.</p>
    <p class="byline" data-de="Eine Einführung · <span>ein Vortrag von Robert Blust</span>">An introduction · <span>a talk by Robert Blust</span></p>
  </section>

</div>

<div class="chrome" id="chrome">

  <a class="name" href="../" aria-label="Back to all talks"><span class="namemark"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="2" y="6.75" width="10.5" height="10.5" rx="1.5"/><rect x="4.75" y="9.5" width="5" height="5" fill="currentColor" stroke="none"/><path d="M12.5 12 h4.5"/><rect x="17" y="9.5" width="5" height="5" fill="currentColor" stroke="none"/></svg></span><b>Company<em>Graph</em></b> · Robert Blust</a>

  <div class="transport" id="transport" role="group" aria-label="Deck controls">

    <div class="lcd" aria-hidden="true">
      <div class="n" id="lcdn"><b id="cur">00</b><span class="sep">/</span><span id="tot">10</span></div>
      <div class="clip"><i id="cliplen"></i></div>
    </div>

    <button class="tbtn" id="tFirst" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.4" y="5" width="2.3" height="14" rx="1"/><path d="M13.2 5.4v13.2L7.6 12z"/><path d="M21 5.4v13.2L13.6 12z"/></svg>
    </button>

      <svg viewBox="0 0 24 24" aria-hidden="true" class="iplay"><path d="M7 4.4L19.2 12 7 19.6z"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ipause"><rect x="6.4" y="4.8" width="3.7" height="14.4" rx="1.1"/><rect x="13.9" y="4.8" width="3.7" height="14.4" rx="1.1"/></svg>

    <button class="tbtn" id="tNext" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 4.6v14.8L18 12z"/></svg>
    </button>

    <button class="tbtn" id="tFull" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="stroked iexpand"><path d="M9.5 4.5H4.5V9.5M14.5 4.5H19.5V9.5M14.5 19.5H19.5V14.5M9.5 19.5H4.5V14.5"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="stroked icontract"><path d="M4.5 9.5H9.5V4.5M19.5 9.5H14.5V4.5M19.5 14.5H14.5V19.5M4.5 14.5H9.5V19.5"/></svg>
    </button>

    </div>

    <div class="tside">
    <div class="tdiv"></div>

    <!-- id="langtoggle" is the container, not just a label: a click that lands on the
         divider between the two buttons bubbles here and swaps the language wholesale,
         mirroring the single-control #langind pattern the talks index uses — verify's
         `translates` check clicks one id twice to round-trip, and a segmented DE/EN
         pair has no such id on its own. Direct clicks on either button still pick that
         language explicitly and stop the bubble, so a sighted mouse user never sees
         the toggle fire twice. -->
    <div class="seg" id="langtoggle" role="group" aria-label="Sprache wechseln — switch language">
      <button type="button" id="langDe" aria-pressed="false">DE</button>
      <div class="tdiv" aria-hidden="true"></div>
      <button type="button" id="langEn" aria-pressed="true">EN</button>

      <svg viewBox="0 0 24 24" aria-hidden="true" class="stroked"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.4"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.4"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.4"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.4"/></svg>

      <svg viewBox="0 0 24 24" aria-hidden="true" class="stroked"><rect x="3.5" y="4.5" width="17" height="11" rx="1.5"/><path d="M7 8.5h10M7 11.8h6M8.5 19.2h7"/></svg>

  </div>
</div>

<div class="bar" id="bar"></div>

<div class="notes" id="notes">
  <h3><span id="noteslabel">Sprecher-Notiz</span> <span class="time" id="ntime"></span></h3>
  <p id="ntext"></p>
  <button class="close" type="button" id="notesclose">Notizen schliessen</button>
</div>

<script>
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  // slide numbering is zero-based everywhere the viewer can see it: the kicker on each
  // slide, the transport's display window, and the audio filenames all say the same number.
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  // The language choice is shared with the other pages on this origin, so arriving from
  // the talks index keeps the language the reader already picked. Storage is guarded:
  // file:// is an opaque origin in some browsers and throws, and a deck that cannot read
  // a preference must still open — in English, its default.
  var LANG_KEY = 'cg-lang';
  function langStored(){ try { return localStorage.getItem(LANG_KEY); } catch (e) { return null; } }
  function langRemember(v){ try { localStorage.setItem(LANG_KEY, v); } catch (e) {} }

  var i = 0, notesOpen = false, lang = langStored() === 'de' ? 'de' : 'en';
  var deck = document.getElementById('deck');
  var bar = document.getElementById('bar'), cur = document.getElementById('cur');
  var notes = document.getElementById('notes'), ntext = document.getElementById('ntext'), ntime = document.getElementById('ntime');
  var chrome = document.getElementById('chrome');
  var lcdn = document.getElementById('lcdn'), cliplen = document.getElementById('cliplen');
  var btn = { first:document.getElementById('tFirst'), prev:document.getElementById('tPrev'),
              play:document.getElementById('tPlay'),  next:document.getElementById('tNext'),
              full:document.getElementById('tFull'),  notes:document.getElementById('tNotes') };
  var langDe = document.getElementById('langDe'), langEn = document.getElementById('langEn');
  document.getElementById('tot').textContent = pad(slides.length - 1);

  var i18n = Array.prototype.slice.call(document.querySelectorAll('[data-de]'));
  i18n.forEach(function(el){ el.setAttribute('data-en', el.innerHTML); });

  var UI = {
    de:{ label:'Sprecher-Notiz', close:'Notizen schliessen',
         title:'CompanyGraph — eine Einführung · ein Vortrag von Robert Blust',
         desc:'Ein Vortrag über das Meta-Modell für den Betrieb eines Unternehmens — das Vokabular, auf das zwei unabhängige Unternehmen zusammenliefen, und warum es als Graph aus Markdown zusammenhält.',
         play:'Vortrag abspielen', pause:'Vortrag pausieren', first:'Zurück zum Anfang',
         prev:'Vorherige Folie', next:'Nächste Folie', full:'Vollbild', unfull:'Vollbild verlassen',
         notes:'Sprecher-Notizen', de:'Auf Deutsch', en:'Auf Englisch', novoice:'Keine Stimme', up:'Zurück zu allen Vorträgen' },
    en:{ label:'Speaker note', close:'Close notes',
         title:'CompanyGraph — an introduction · a talk by Robert Blust',
         desc:'A talk on the meta-model for operating a company — the vocabulary two independent companies converged on, and why it holds together as a graph of Markdown.',
         play:'Play the talk', pause:'Pause the talk', first:'Back to the start',
         prev:'Previous slide', next:'Next slide', full:'Fullscreen', unfull:'Leave fullscreen',
         notes:'Speaker notes', de:'In German', en:'In English', novoice:'No voice', up:'Back to all talks' }
  };

  function applyLang(){
    i18n.forEach(function(el){ el.innerHTML = el.getAttribute('data-' + lang); });
    var t = UI[lang];
    document.title = t.title;
    document.getElementById('metadesc').setAttribute('content', t.desc);
    document.getElementById('noteslabel').textContent = t.label;
    document.getElementById('notesclose').textContent = t.close;
    langDe.setAttribute('aria-pressed', lang === 'de' ? 'true' : 'false');
    langEn.setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
    langDe.setAttribute('aria-label', t.de);
    langEn.setAttribute('aria-label', t.en);
    btn.first.setAttribute('aria-label', t.first);
    btn.prev.setAttribute('aria-label', t.prev);
    btn.next.setAttribute('aria-label', t.next);
    btn.notes.setAttribute('aria-label', t.notes);
    var up = document.getElementById('tUp');
    up.setAttribute('aria-label', t.up);
    up.setAttribute('title', t.up);
    labelPlay();
    labelFull();
    document.documentElement.lang = lang;
    if (playing) {
      if (synth) synth.cancel();
      clip.pause();
      setTimeout(narrateCurrent, 120);
    }
    render();
  }

  /* The transport is a real element with a measured height, and two other things have to
     land exactly on top of it: the notes sheet, and the progress bar on mobile. */
  function measureChrome(){
    document.documentElement.style.setProperty('--chromeH', chrome.offsetHeight + 'px');
  }

  function fitNotes(){
    var s = slides[i];
    s.style.transform = '';
    if(!notesOpen) return;
    var avail = notes.getBoundingClientRect().top - 20;
    var need  = s.scrollHeight;
    if(need > avail){ s.style.transform = 'scale(' + Math.max(0.5, avail/need) + ')'; }
  }

  function render(){
    slides.forEach(function(s,n){ if(n!==i) s.style.transform=''; s.classList.toggle('active', n===i); });
    bar.style.width = ((i+1)/slides.length*100) + '%';
    cur.textContent = pad(i);
    if(notesOpen){
      var d = slides[i].dataset;
      ntext.innerHTML = (lang === 'en' && d.notesEn) ? d.notesEn : d.notes;
      ntime.textContent = d.time || '';
    }
    fitNotes();
  }
  window.addEventListener('resize', function(){ measureChrome(); fitNotes(); });
  function go(n){ i = Math.max(0, Math.min(slides.length-1, n)); render(); }

  /* Turning the page by hand does not end the talk — the voice follows to the slide you
     landed on. JUMP_MS is why: it lets someone click through five slides and hear only the
     fifth, instead of a syllable of each one on the way. Back to the start is the exception,
     because going back to slide zero is leaving the talk, not moving inside it. */
  var JUMP_MS = 400;

  function manual(n){
    if (!playing) { go(n); return; }
    stopVoice();
    go(n);
    gapTimer = setTimeout(function(){ if (playing) narrateCurrent(); }, JUMP_MS);
  }

  function restart(){ if (playing) stopNarration(); go(0); }

  function setNotes(open){
    notesOpen = open;
    notes.classList.toggle('show', notesOpen);
    // the closed sheet is only translated off-screen, so its close button would otherwise
    // still be a tab stop for something nobody can see
    notes.toggleAttribute('inert', !notesOpen);
    deck.classList.toggle('notes-open', notesOpen);
    btn.notes.setAttribute('aria-pressed', notesOpen ? 'true' : 'false');
    render();
  }

  function labelFull(){
    var on = !!document.fullscreenElement;
    btn.full.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.full.setAttribute('aria-label', on ? UI[lang].unfull : UI[lang].full);
  }
  function toggleFull(){
    if(!document.fullscreenElement){
      var r = document.documentElement.requestFullscreen();
      if (r && r.catch) r.catch(function(){});
    } else { document.exitFullscreen(); }
  }
  document.addEventListener('fullscreenchange', function(){ labelFull(); measureChrome(); });

  function setLang(next){ if (next === lang) return; lang = next; langRemember(next); applyLang(); }
  function toggleLang(){ setLang(lang === 'de' ? 'en' : 'de'); }

  btn.first.addEventListener('click', restart);
  btn.prev .addEventListener('click', function(){ manual(i-1); });
  btn.next .addEventListener('click', function(){ manual(i+1); });
  btn.play .addEventListener('click', function(){ toggleNarration(); });
  btn.full .addEventListener('click', toggleFull);
  btn.notes.addEventListener('click', function(){ setNotes(!notesOpen); });
  document.getElementById('notesclose').addEventListener('click', function(){ setNotes(false); });
  // Each button picks its language directly and stops the click there, so it never
  // also reaches #langtoggle's own listener below — a mouse user who clicks the
  // already-active button sees nothing happen, same as before this control existed.
  langDe.addEventListener('click', function(e){ e.stopPropagation(); setLang('de'); });
  langEn.addEventListener('click', function(e){ e.stopPropagation(); setLang('en'); });
  // A click that lands on the divider between the two buttons (or, from a script,
  // on #langtoggle itself) is not aimed at either language specifically — it toggles,
  // the same as the talks index's single #langind control does.
  document.getElementById('langtoggle').addEventListener('click', toggleLang);

  /* The deck is driven by the buttons. The navigation keys stay because a presenter
     remote sends them — it is a clicker pretending to be a keyboard — and are
     deliberately not advertised anywhere on screen. N and L are a second, unrelated
     reason for the same handler: N mirrors the notes button and L mirrors the talks
     index's #langind shortcut, so both habits carry over into the deck. */
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ manual(i+1); e.preventDefault(); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ manual(i-1); e.preventDefault(); }
    else if(e.key==='Home'){ restart(); e.preventDefault(); }
    else if(e.key==='End'){ manual(slides.length-1); e.preventDefault(); }
    else if(e.key==='n'||e.key==='N'){ setNotes(!notesOpen); e.preventDefault(); }
    else if(e.key==='l'||e.key==='L'){ toggleLang(); e.preventDefault(); }
  });

  /* Swipe turns the page on touch. A mostly-vertical drag is someone scrolling a long
     slide, which portrait layout makes routine, so only a decisively horizontal one counts. */
  var tx = 0, ty = 0, tt = 0;
  deck.addEventListener('touchstart', function(e){
    if (e.touches.length !== 1) { tt = 0; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now();
  }, {passive:true});
  deck.addEventListener('touchend', function(e){
    if (!tt || Date.now() - tt > 700) return;
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    manual(dx < 0 ? i + 1 : i - 1);
  }, {passive:true});

  measureChrome();
  setNotes(false);
  applyLang();

  /* ---------- narration ----------
     The speaker notes mix stage directions with what is actually said: the <em class='cue'>
     spans are Regie-Instruktionen ("the title stays up while I greet"), the rest is
     Sprechtext. Only the latter is spoken.

     A recorded clip is played when one exists (audio/<lang>/<nn>.mp3), and the browser's own
     voice reads the note when one does not — so a half-recorded deck still plays end to end.

     Nothing is timed either way. Each slide advances on the end event of whichever source spoke,
     so the deck follows the voice rather than a clock, and stays correct when a note is edited or
     a clip is re-recorded. The data-time cues are untouched: they are the presenter's pacing for
     the live talk, which runs about three times longer than the narration and is a different
     timeline entirely. */
  var synth = window.speechSynthesis;
  var clip = new Audio();
  clip.preload = 'auto';
  var playing = false, utter = null, gapTimer = null, msgTimer = null;

  // audio needs no speech synthesis, so the control stays even where synthesis is missing

  function labelPlay(){
    var l = playing ? UI[lang].pause : UI[lang].play;
    btn.play.setAttribute('aria-label', l);
    btn.play.setAttribute('aria-pressed', playing ? 'true' : 'false');
    btn.play.classList.toggle('on', !!playing);
  }

  /* The display window is where a player says NO DISC. A refusal that shows up there reads
     as the machine answering, and needs no second label on the button. */
  function lcdMessage(text){
    clearTimeout(msgTimer);
    lcdn.dataset.keep = lcdn.dataset.keep || lcdn.innerHTML;
    lcdn.textContent = text;
    lcdn.classList.add('msg');
    msgTimer = setTimeout(function(){
      lcdn.innerHTML = lcdn.dataset.keep;
      lcdn.classList.remove('msg');
      delete lcdn.dataset.keep;
      cur = document.getElementById('cur');
      render();
    }, 2600);
  }

  // the hairline under the track number: how far into this slide's clip the voice is
  function setClipProgress(f){ cliplen.style.width = Math.max(0, Math.min(1, f)) * 100 + '%'; }
  clip.addEventListener('timeupdate', function(){
    if (playing && clip.duration) setClipProgress(clip.currentTime / clip.duration);
  });

  /* The headline, read as the spoken lead-in. On screen it is the thing the eye lands on
     first; in audio nothing announced it, so the argument arrived before its own point. */
  function slideTitle(slide){
    if (slide.dataset.sayTitle === 'no') return '';
    var h = slide.querySelector('h1');
    if (!h) return '';
    var raw = (lang === 'en' && h.dataset.en) ? h.dataset.en : h.innerHTML;
    var d = document.createElement('div'); d.innerHTML = raw;
    return (d.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function spokenText(slide){
    var raw = (lang === 'en' && slide.dataset.notesEn) ? slide.dataset.notesEn : slide.dataset.notes;
    if (!raw) return '';
    var d = document.createElement('div');
    d.innerHTML = raw;
    // only the directions: a bare <em> is emphasis inside the sentence and must be spoken,
    // or the voice says "muss zuerst wissen, Gast" and loses the word the line turns on
    d.querySelectorAll('em.cue').forEach(function(e){ e.remove(); });
    var body = (d.textContent || '').replace(/\s+/g, ' ').trim();
    var title = slideTitle(slide);
    return title ? title + '\n\n' + body : body;
  }

  function pickVoice(){
    var want = lang === 'de' ? 'de' : 'en';
    var voices = synth.getVoices() || [];
    var exact = voices.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf(want) === 0; });
    if (!exact.length) return null;
    // prefer a local voice: network voices stall the onend event the deck advances on
    return exact.filter(function(v){ return v.localService; })[0] || exact[0];
  }

  function say(text, whenDone){
    utter = new SpeechSynthesisUtterance(text);
    var v = pickVoice();
    if (v) utter.voice = v;
    utter.lang = v ? v.lang : (lang === 'de' ? 'de-DE' : 'en-GB');
    utter.rate = 0.98;
    utter.onend = function(){ if (playing) whenDone(); };
    utter.onerror = function(){ stopNarration(); };
    // a throwing speak() would otherwise leave the deck stuck in a playing state that
    // never advances, because onend can no longer fire
    try { synth.speak(utter); } catch (e) { stopNarration(); }
  }

  function clipUrl(n){
    var k = slides[n].querySelector('.kicker');
    var id = k && k.dataset.n ? k.dataset.n : ('0' + n).slice(-2);
    return 'audio/' + lang + '/' + id + '.mp3';
  }

  /* Fetch the next clip while this one plays, so the gap between slides is the pause we
     intended rather than a download. */
  function preloadNext(){
    if (i + 1 >= slides.length) return;
    var a = new Audio(); a.preload = 'auto'; a.src = clipUrl(i + 1);
  }

  function narrateCurrent(){
    if (!playing) return;
    setClipProgress(0);
    var text = spokenText(slides[i]);
    if (!text) { advanceOrStop(); return; }

    clip.onended = function(){ if (playing) advanceOrStop(); };
    clip.onerror = function(){
      // no recording for this slide or this language — read the note instead
      if (playing) say(text, advanceOrStop);
    };
    clip.src = clipUrl(i);
    var started = clip.play();
    if (started && started.catch) {
      started.then(preloadNext).catch(function(){ if (playing) say(text, advanceOrStop); });
    } else {
      preloadNext();
    }
  }

  /* Two pauses, doing different jobs. SETTLE sits on the slide that was just narrated, so the
     point has a moment to land before it is taken away. READ sits on the new slide before the
     voice starts, so it can be read first — a listener has no presenter to watch, and a slide
     talked over from the first frame is a slide nobody reads. */
  var SETTLE_MS = 5000;
  var READ_MS   = 2000;

  function advanceOrStop(){
    if (!playing) return;
    if (i >= slides.length - 1) { stopNarration(); return; }
    gapTimer = setTimeout(function(){
      if (!playing) return;
      go(i + 1);
      gapTimer = setTimeout(function(){ if (playing) narrateCurrent(); }, READ_MS);
    }, SETTLE_MS);
  }

  function startNarration(){
    // synthesis is only the fallback now, so its absence is not a reason to refuse
    if (!synth) { playing = true; labelPlay(); narrateCurrent(); return; }
    if (!pickVoice() && !hasClips()) {
      lcdMessage(UI[lang].novoice);
      return;
    }
    playing = true;
    labelPlay();
    narrateCurrent();
  }

  // silence whatever is speaking, without deciding whether the talk is over
  function stopVoice(){
    clearTimeout(gapTimer);
    clip.pause();
    clip.onended = clip.onerror = null;
    if (synth) synth.cancel();
    setClipProgress(0);
  }

  function stopNarration(){
    playing = false;
    stopVoice();
    labelPlay();
  }

  /* Optimistic: if a clip exists we never need a voice installed. Checked lazily so the
     deck makes no network request until someone actually presses play. */
  var clipsSeen = null;
  function hasClips(){
    if (clipsSeen !== null) return clipsSeen;
    clipsSeen = true;                       // assume yes; clip.onerror handles the truth
    return clipsSeen;
  }

  function toggleNarration(){ playing ? stopNarration() : startNarration(); }

  // voices load asynchronously in some browsers
  if (synth && typeof synth.onvoiceschanged !== 'undefined') {
    synth.addEventListener('voiceschanged', function(){ /* refresh list */ });
  }
  window.addEventListener('beforeunload', function(){ if (synth) synth.cancel(); });
</script>

<script>
// Scale the 1600×900 canvas to the screen. Below the breakpoint the deck reflows
// into a scrolling reading view instead, so the transform is cleared there.
(function(){
  var CH = 900;
  var deck = document.getElementById("deck");
  var small = window.matchMedia("(max-width: 860px), (max-aspect-ratio: 4/5)");
  function fit(){
    if (small.matches) { deck.style.transform = ""; deck.style.width = ""; return; }
    // Height is the fixed dimension; width is whatever the screen's aspect asks
    // for. The canvas then covers the viewport exactly — no bars, any aspect.
    var s = window.innerHeight / CH;
    deck.style.width = (window.innerWidth / s) + "px";
    deck.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  if (small.addEventListener) small.addEventListener("change", fit);
  fit();
})();
</script>
</body>
