<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="CompanyGraph"
     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
  <!-- Ownership, carried by nesting: an outlined square holds a filled one — remove the
       owner and what it owned is gone with it; an orphan is unrepresentable. Reference,
       by canonical name: a line out to a second filled square, something nothing owns. -->
  <rect x="1.75" y="5.75" width="10.5" height="12.5" rx="1.5"/>
  <rect x="4.5" y="9.5" width="5" height="5" fill="currentColor" stroke="none"/>
  <path d="M12.25 12 h4.5"/>
  <rect x="16.75" y="9.5" width="5" height="5" fill="currentColor" stroke="none"/>
</svg>
